name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: symskill

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        # Windows runners default to pwsh; this script is bash on every OS.
        shell: bash
        run: |
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ext=".exe"
          fi
          bin="target/${{ matrix.target }}/release/${BIN_NAME}${ext}"
          # Only strip on Linux to avoid corrupting macOS code signatures
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            strip "$bin" || true
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # zip rather than tar.gz: it is what Windows users expect and what
            # Explorer opens without extra tooling.
            archive="${BIN_NAME}-${{ matrix.platform }}.zip"
            # 7z stores whatever path it is handed and has no strip-components,
            # so stage the binary alongside the archive to keep it at the root
            # like `tar -C` does. Relative paths only: 7z.exe is a native
            # program, so absolute POSIX paths would depend on MSYS translation.
            cp "$bin" "${BIN_NAME}${ext}"
            7z a "$archive" "${BIN_NAME}${ext}" > /dev/null
            rm "${BIN_NAME}${ext}"
          else
            archive="${BIN_NAME}-${{ matrix.platform }}.tar.gz"
            tar -C "$(dirname "$bin")" -czf "$archive" "${BIN_NAME}${ext}"
          fi
          # macOS ships shasum; Linux and Git Bash on Windows ship sha256sum.
          # Both emit "<hash>  <file>", which is what the tap job parses.
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          else
            shasum -a 256 "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          # Archive extension varies by OS, so match on the platform stem.
          path: ${{ env.BIN_NAME }}-${{ matrix.platform }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.sha256

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: actions/checkout@v6
        with:
          repository: bquenin/homebrew-symskill
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Generate formula and push to tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA_ARM=$(awk '{print $1}' symskill-darwin-arm64.sha256)
          SHA_INTEL=$(awk '{print $1}' symskill-darwin-amd64.sha256)
          SHA_LINUX=$(awk '{print $1}' symskill-linux-amd64.sha256)

          mkdir -p tap/Formula
          cat > tap/Formula/symskill.rb << EOF
          class Symskill < Formula
            desc "Terminal UI and CLI for managing symlinked agent skills"
            homepage "https://github.com/bquenin/symskill"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/bquenin/symskill/releases/download/v${VERSION}/symskill-darwin-arm64.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/bquenin/symskill/releases/download/v${VERSION}/symskill-darwin-amd64.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/bquenin/symskill/releases/download/v${VERSION}/symskill-linux-amd64.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "symskill"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/symskill --version")
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/symskill.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/symskill.rb
          git commit -m "symskill ${VERSION}"
          git push
